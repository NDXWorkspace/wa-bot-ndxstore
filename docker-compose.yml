services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wa-bot-ndxstore
    ports:
      - "3000:3000"
    volumes:
      - ./wa-session:/app/wa-session
      - ./.wwebjs_cache:/app/.wwebjs_cache
      - ./logs:/app/logs
      # JANGAN bind-mount ./.notified.json sebagai file: kalau belum ada di
      # host, Docker membuatnya sebagai DIREKTORI → app EISDIR saat tulis.
      # File ini dibuat otomatis di dalam container (ephemeral).
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    mem_limit: 768m
    memswap_limit: 1024m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
