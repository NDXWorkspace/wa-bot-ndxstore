name: Build Android APK

on:
  push:
    branches: [ master ]
    paths:
      - 'android/**'
      - 'public/app.html'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Sync latest UI into Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp public/app.html android/app/src/main/assets/index.html

      - name: Build Release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Copy APK to root
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk WA-AI-Bot.apk
          ls -lh WA-AI-Bot.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WA-AI-Bot-APK
          path: WA-AI-Bot.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "WA AI Bot — Aplikasi Android (APK)"
          body: "Aplikasi Android (APK) resmi untuk pairing WhatsApp & konfigurasi Custom AI langsung lewat internet tanpa Termux."
          files: WA-AI-Bot.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit compiled WA-AI-Bot.apk to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add WA-AI-Bot.apk android/app/src/main/assets/index.html
          git diff --staged --quiet || (git commit -m "chore(apk): update compiled WA-AI-Bot.apk [skip ci]" && git push origin HEAD:master)
