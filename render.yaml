services:
  - type: web
    name: wa-bot-ndxstore
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 3000
      - key: SUPABASE_URL
        value: https://jlfrtyyjxkmdetdbeakv.supabase.co
      - key: AI_API_BASE
        value: https://text.pollinations.ai
      - key: AI_MODEL
        value: openai
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3-super-120b-a12b:free
      - key: LOG_LEVEL
        value: info
      - key: LOG_CONSOLE
        value: "true"
      - key: API_BASE
        value: https://ndxstoreid.vercel.app
    # /health returns 200 while the process is alive (even before WhatsApp is paired).
    healthCheckPath: /health
    autoDeploy: true
    numInstances: 1
